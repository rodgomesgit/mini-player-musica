name: Deploy para o GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pacote de atualização do app Android (src/lib/atualizacao.js): a parte
      # web do app, publicada junto com o site.
      - name: Gera o pacote de atualização do app Android
        run: |
          npm run build:android
          (cd dist && zip -qr ../bundle-android.zip .)
        env:
          VITE_VERSAO_WEB: ${{ github.run_number }}
      - run: npm run build
      - name: Publica o pacote junto com o site
        run: |
          mkdir -p dist/android
          mv bundle-android.zip dist/android/bundle-${{ github.run_number }}.zip
          node scripts/manifesto-atualizacao.mjs ${{ github.run_number }} dist/android/bundle-${{ github.run_number }}.zip > dist/android/versao.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
